basePath: /api/v1
definitions:
  basic-template-service_internal_dto_payment_type.CreateRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  basic-template-service_internal_dto_payment_type.GetListResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  basic-template-service_lib_errors.Code:
    enum:
    - UNKNOWN_ERROR
    - INTERNAL_SERVER_ERROR
    - BAD_REQUEST
    - UNAUTHORIZED
    - DUPLICATE_REFERENCE
    - FORBIDDEN
    - NOT_FOUND
    - FINANCIAL_REPORT_ALREADY_UPLOADED
    - TOO_MANY_REQUESTS
    - USER_NOT_FOUND
    - SESSION_NOT_FOUND
    - INVALID_PASSWORD
    type: string
    x-enum-varnames:
    - ErrCodeUnknown
    - ErrCodeInternalServerError
    - ErrCodeBadRequest
    - ErrCodeUnauthorized
    - ErrCodeDuplicateReference
    - ErrCodeForbidden
    - ErrCodeNotFound
    - ErrCodeFinancialReportAlreadyUploaded
    - ErrCodeTooManyRequests
    - ErrCodeUserNotFound
    - ErrCodeSessionNotFound
    - ErrCodeInvalidPassword
  basic-template-service_lib_response.ErrorResponse:
    properties:
      error_code:
        $ref: '#/definitions/basic-template-service_lib_errors.Code'
      message:
        type: string
    type: object
  basic-template-service_lib_response.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      meta: {}
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    API for managing basic CRUD API.
    <br/><b>Developer:</b> Muhammad Brilian Satria Utama
    <b>Environment:</b> Development
  title: Basic Template API
  version: "0.0"
paths:
  /payment-type:
    post:
      consumes:
      - application/json
      description: Creates a new payment type.
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/basic-template-service_internal_dto_payment_type.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/basic-template-service_lib_response.SuccessResponse'
        "409":
          description: Duplicate Reference
          schema:
            $ref: '#/definitions/basic-template-service_lib_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/basic-template-service_lib_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create A New Payment Type
      tags:
      - Payment Type
  /payment-type/list:
    get:
      consumes:
      - application/json
      description: Gets all available payment types.
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/basic-template-service_lib_response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/basic-template-service_internal_dto_payment_type.GetListResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/basic-template-service_lib_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Payment Types
      tags:
      - Payment Type
swagger: "2.0"
