basePath: /api/v1
definitions:
  basic-template-service_internal_dto_payment_type.CreateRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  basic-template-service_internal_dto_payment_type.GetDetailResponse:
    properties:
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
  basic-template-service_internal_dto_payment_type.GetListResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  basic-template-service_internal_dto_payment_type.GetPaginationResponse:
    properties:
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
  basic-template-service_internal_dto_payment_type.UpdateRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  basic-template-service_lib_errors.Code:
    enum:
    - UNKNOWN_ERROR
    - INTERNAL_SERVER_ERROR
    - BAD_REQUEST
    - UNAUTHORIZED
    - DUPLICATE_REFERENCE
    - FORBIDDEN
    - NOT_FOUND
    - FINANCIAL_REPORT_ALREADY_UPLOADED
    - TOO_MANY_REQUESTS
    - USER_NOT_FOUND
    - SESSION_NOT_FOUND
    - INVALID_PASSWORD
    type: string
    x-enum-varnames:
    - ErrCodeUnknown
    - ErrCodeInternalServerError
    - ErrCodeBadRequest
    - ErrCodeUnauthorized
    - ErrCodeDuplicateReference
    - ErrCodeForbidden
    - ErrCodeNotFound
    - ErrCodeFinancialReportAlreadyUploaded
    - ErrCodeTooManyRequests
    - ErrCodeUserNotFound
    - ErrCodeSessionNotFound
    - ErrCodeInvalidPassword
  basic-template-service_lib_response.BadRequestResponse:
    properties:
      error_code:
        $ref: '#/definitions/basic-template-service_lib_errors.Code'
      errors:
        items:
          $ref: '#/definitions/basic-template-service_lib_response.ValidationErrorField'
        type: array
      message:
        type: string
    type: object
  basic-template-service_lib_response.ErrorResponse:
    properties:
      error_code:
        $ref: '#/definitions/basic-template-service_lib_errors.Code'
      message:
        type: string
    type: object
  basic-template-service_lib_response.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      meta: {}
    type: object
  basic-template-service_lib_response.ValidationErrorField:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    API for managing basic CRUD API.
    <br/><b>Developer:</b> Muhammad Brilian Satria Utama
    <b>Environment:</b> Development
  title: Basic Template API
  version: "0.0"
paths:
  /payment-type:
    post:
      consumes:
      - application/json
      description: Creates a new payment type.
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/basic-template-service_internal_dto_payment_type.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/basic-template-service_lib_response.SuccessResponse'
        "409":
          description: Duplicate Reference
          schema:
            $ref: '#/definitions/basic-template-service_lib_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/basic-template-service_lib_response.ErrorResponse'
      summary: Create A New Payment Type
      tags:
      - Payment Type
  /payment-type/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a payment type by ID.
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/basic-template-service_lib_response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/basic-template-service_lib_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/basic-template-service_lib_response.ErrorResponse'
      summary: Delete A Payment Type
      tags:
      - Payment Type
    get:
      consumes:
      - application/json
      description: Gets payment type detail by ID.
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/basic-template-service_lib_response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/basic-template-service_internal_dto_payment_type.GetDetailResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/basic-template-service_lib_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/basic-template-service_lib_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/basic-template-service_lib_response.ErrorResponse'
      summary: Get Payment Type Detail
      tags:
      - Payment Type
    put:
      consumes:
      - application/json
      description: Updates a payment type and validates that the name is not already
        used by another payment type.
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: string
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/basic-template-service_internal_dto_payment_type.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/basic-template-service_lib_response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/basic-template-service_lib_response.BadRequestResponse'
        "409":
          description: Duplicate Reference
          schema:
            $ref: '#/definitions/basic-template-service_lib_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/basic-template-service_lib_response.ErrorResponse'
      summary: Update A Payment Type
      tags:
      - Payment Type
  /payment-type/list:
    get:
      consumes:
      - application/json
      description: Gets all available payment types.
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/basic-template-service_lib_response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/basic-template-service_internal_dto_payment_type.GetListResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/basic-template-service_lib_response.ErrorResponse'
      summary: Get Payment Types
      tags:
      - Payment Type
  /payment-type/pagination:
    get:
      consumes:
      - application/json
      description: Gets payment types with pagination.
      parameters:
      - description: Search by name
        in: query
        name: search
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Number of items per page
        in: query
        name: limit
        type: integer
      - default: name
        description: Column to sort by
        enum:
        - name
        - is_active
        in: query
        name: sortBy
        type: string
      - default: asc
        description: Sort direction
        enum:
        - asc
        - desc
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/basic-template-service_lib_response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/basic-template-service_internal_dto_payment_type.GetPaginationResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/basic-template-service_lib_response.ErrorResponse'
      summary: Get Payment Types with Pagination
      tags:
      - Payment Type
swagger: "2.0"
